name: Generar posts

on:
  schedule:
    # GitHub retrasa los cron gratuitos algunas horas; este disparo apunta a
    # que corra temprano a la manana en horario UK.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ADSENSE_INARTICLE_SLOT: ${{ secrets.ADSENSE_INARTICLE_SLOT }}
        run: node scripts/generar-posts.mjs

      - name: Guardar processed-log.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed-log.json
          git diff --staged --quiet || git commit -m "Actualizar processed-log.json"
          git push
