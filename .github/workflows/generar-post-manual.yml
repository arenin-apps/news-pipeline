name: Generar post desde URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL del articulo a convertir en post'
        required: true
        type: string
      tipo:
        description: 'Tipo de contenido'
        required: true
        default: 'noticia'
        type: choice
        options:
          - noticia
          - guia

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Generar post desde URL
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ADSENSE_INARTICLE_SLOT: ${{ secrets.ADSENSE_INARTICLE_SLOT }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          POST_URL: ${{ github.event.inputs.url }}
          POST_TIPO: ${{ github.event.inputs.tipo }}
        run: node scripts/generar-post-manual.mjs
      - name: Guardar cola-venenin.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cola-venenin.json
          git diff --staged --quiet || git commit -m "Actualizar cola-venenin.json"
          git pull --rebase
          git push
